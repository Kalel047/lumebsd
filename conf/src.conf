# LumeBSD "Farol" - edição workstation (notebooks ThinkPad)
# Tudo do FreeBSD base, exceto o que não faz sentido num notebook pessoal.
# As bibliotecas de 32 bits (lib32) ficam: o Wine as usa para os programas
# do Windows de 32 bits.
WITHOUT_TESTS=yes
WITHOUT_LLDB=yes
WITHOUT_DEBUG_FILES=yes
WITHOUT_GAMES=yes
WITHOUT_OFED=yes
WITHOUT_LLVM_ASSERTIONS=yes
WITH_DISK_IMAGE_TOOLS_BOOTSTRAP=yes
WITHOUT_SENDMAIL=yes
