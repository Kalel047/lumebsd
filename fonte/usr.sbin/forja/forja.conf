# /etc/forja/forja.conf - preferências da forja(8).

# Opções para todos os pacotes que a forja compilar (como as USE flags
# globais do Gentoo). Use +OPÇÃO para ligar e -OPÇÃO para desligar.
# Valem só para o que é compilado; pacotes binários vêm como o FreeBSD fez.
opcoes_globais="-DOCS -EXAMPLES"

# Ramo da árvore de ports. "auto" usa o trimestre atual (ex.: 2026Q4),
# o mesmo dos pacotes binários, para os dois combinarem.
ramo=auto

# Trabalhos de compilação em paralelo ("auto" = um por núcleo).
jobs=auto

# Criar um ambiente de boot (bectl) antes de "forja atualizar".
# Se uma atualização der problema, escolha o anterior no menu de boot.
snapshot=sim

# "sim" compila da fonte tudo o que você pedir, mesmo sem opções próprias.
sempre_fonte=nao

# De onde baixar a árvore de ports quando não há git (ou ele falha): um
# tarball .tar.gz. Vazio = o espelho do GitHub para o trimestre atual.
arvore_url=
