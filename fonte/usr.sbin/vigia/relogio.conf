# Exemplo mínimo: escreve a hora no log a cada 10 segundos.
# Para usar: cp /usr/share/examples/vigia/relogio.conf /etc/vigia/servicos/
#            vigia recarregar
descricao = Relógio de exemplo (escreve a hora no log)
comando = sh -c 'while true; do date; sleep 10; done'
usuario = nobody
reiniciar = sempre
