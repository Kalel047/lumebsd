# Confere, a cada push, que os patches aplicam no FreeBSD 15.1, que fonte/
# é igual ao que eles criam, e que scripts, Python e manuais estão bons.
# Leva poucos minutos; o build inteiro fica em build.yml.
name: Verificar

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 1"   # toda segunda: o releng/15.1 andou?

permissions:
  contents: read

jobs:
  verificar:
    name: Patches no FreeBSD (${{ matrix.base }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # fixado: o commit testado (FREEBSD_COMMIT no build-lumebsd.sh)
        # topo: o releng/15.1 de hoje; se falhar, os patches precisam de
        # atualização, mas o build fixado continua valendo
        base: [fixado, topo]
    continue-on-error: ${{ matrix.base == 'topo' }}
    steps:
      - uses: actions/checkout@v4

      - name: Ferramentas
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q shellcheck mandoc

      - name: FreeBSD releng/15.1
        run: |
          if [ "${{ matrix.base }}" = fixado ]; then
            alvo=$(sed -n 's/^FREEBSD_COMMIT=\${FREEBSD_COMMIT:-\([0-9a-f]*\)}$/\1/p' build-lumebsd.sh)
          else
            alvo=refs/heads/releng/15.1
          fi
          test -n "$alvo"
          git init -q src
          git -C src fetch -q --depth 1 https://github.com/freebsd/freebsd-src.git "$alvo"
          git -C src checkout -q FETCH_HEAD
          git -C src log -1 --format='base: %H %s'

      - name: Aplicar os patches
        run: |
          for p in patches/*.patch; do
            echo "::group::$p"
            (cd src && git apply --verbose "../$p")
            echo "::endgroup::"
          done

      - name: fonte/ igual aos patches
        run: python3 ferramentas/fonte.py conferir src

      - name: Papel noite igual ao gerado do Papel
        run: |
          cp -R src/usr.sbin/lume-configurar/tema tema-gerado
          python3 ferramentas/tema-noite.py tema-gerado
          diff -r src/usr.sbin/lume-configurar/tema tema-gerado

      - name: Scripts (sh -n e shellcheck)
        run: |
          set -e
          for f in build-lumebsd.sh fonte/usr.sbin/forja/forja.sh \
                   fonte/usr.sbin/lume-configurar/*.sh fonte/libexec/rc/rc.d/*; do
            echo "$f"
            sh -n "$f"
            shellcheck -s sh -S error "$f"
          done

      - name: Python
        run: python3 -m py_compile ferramentas/*.py tests/*.py

      - name: Manuais (mandoc)
        run: |
          for m in $(find fonte app -name '*.[1-8]'); do
            mandoc -T lint -W error "$m"
          done

      # Os apps (Atualizações e Programas do LumeBSD) e os efeitos do KWin
      # compilam contra o FreeBSD 15.1 (o base.txz da release) e os pacotes
      # do FreeBSD, como no build.
      - name: Apps e efeitos (compilam)
        if: matrix.base == 'fixado'
        run: |
          sudo apt-get install -y -q clang-19 lld-19 llvm-19 libarchive-tools libxml2-utils
          mkdir -p freebsd qt
          curl -sSfL https://download.freebsd.org/releases/amd64/15.1-RELEASE/base.txz |
              bsdtar -xf - -C freebsd ./lib ./usr/lib ./usr/include
          python3 ferramentas/pacotes.py --sem-dependencias qt qt6-base
          python3 ferramentas/montar-app.py --so-compilar freebsd \
              "$(ls qt/qt6-base-[0-9]*.pkg | head -1)" apps
          file apps/*
          # Os efeitos do KWin (o filtro e-ink, para o X11 e o Wayland)
          python3 ferramentas/pacotes.py --sem-dependencias qt kf6-kcoreaddons \
              kf6-kconfig kf6-kglobalaccel plasma6-kwin plasma6-kwin-x11 libepoxy \
              libxcb xorgproto libdrm wayland libxkbcommon libglvnd \
              plasma6-kdecoration kf6-kwindowsystem
          python3 ferramentas/montar-efeitos.py --so-compilar freebsd qt efeitos
          file efeitos/*/lume_*.so efeitos/decoracao/*.so
          # O lume-motor para o FreeBSD
          python3 ferramentas/pacotes.py --sem-dependencias qt mesa-libs freetype2 png
          python3 ferramentas/montar-motor.py --so-compilar freebsd qt motor-bin
          file motor-bin/*
          # O lume-macho e o programa de teste do macOS (Mach-O)
          python3 ferramentas/montar-mac.py --so-compilar freebsd mac-bin
          file mac-bin/*
          for j in app/lume-animacoes/*/contents/code/main.js; do node --check "$j"; done
          for m in app/lume-tinta/metadata.json app/lume-animacoes/*/metadata.json; do
            python3 -m json.tool "$m" >/dev/null
          done
          for x in app/*/*.policy; do xmllint --noout "$x"; done
          for d in app/*/*.desktop fonte/usr.sbin/lume-configurar/*/*.desktop \
                   fonte/usr.sbin/lume-configurar/loja/atalhos/*.desktop; do
            grep -q '^\[Desktop Entry\]' "$d" || { echo "$d"; exit 1; }
          done

      # O lume-motor também no Linux, sem tela (Mesa llvmpipe): desenha a
      # página, o zoom e a troca de texto, e os quadros vão como artefato.
      - name: Motor de renderização (desenha sem tela)
        if: matrix.base == 'fixado'
        run: |
          sudo apt-get install -y -q libegl-dev libgles-dev libgbm-dev libdrm-dev \
              libpng-dev libfreetype-dev libegl-mesa0 libgl1-mesa-dri fonts-ibm-plex
          cd app/lume-motor
          # As contas do papel (papel.glsl) embutidas, como no montar-motor.py
          python3 -c "import sys; sys.path.insert(0, '../../ferramentas'); import sistema; sistema.embutir_papel('.')"
          # A biblioteca (liblume-motor) e o demonstrador ligado a ela
          cc -std=c11 -D_GNU_SOURCE -O2 -Wall -Wextra -Wno-unused-parameter -Werror -fPIC -shared \
              $(pkg-config --cflags freetype2 libdrm) -Wl,-soname,liblume-motor.so.1 \
              -o liblume-motor.so.1 motor.c cena.c saida.c \
              $(pkg-config --libs freetype2) -lEGL -lGLESv2 -lgbm -ldrm -lpng -lm
          ln -sf liblume-motor.so.1 liblume-motor.so
          cc -std=c11 -D_GNU_SOURCE -O2 -Wall -Wextra -Wno-unused-parameter -Werror \
              $(pkg-config --cflags freetype2 libdrm) -o lume-motor demo.c -L. -llume-motor -lGLESv2 -lm
          LIBGL_ALWAYS_SOFTWARE=1 LD_LIBRARY_PATH=. timeout 600 ./lume-motor --png quadros --tamanho 640x360 --hz 30 --segundos 6.2
          ls quadros/*.png

      - uses: actions/upload-artifact@v4
        if: matrix.base == 'fixado'
        with:
          name: motor-quadros
          path: app/lume-motor/quadros/
          retention-days: 14

      # Cada pacote do catálogo da loja (lume loja e o app Programas do
      # LumeBSD) existe no repositório quarterly do FreeBSD 15; os kits e as
      # categorias batem. O semanal pega pacotes que saíram do repositório.
      - name: Catálogo da loja (pacotes existem)
        if: matrix.base == 'fixado'
        run: |
          sudo apt-get install -y -q libarchive-tools
          python3 ferramentas/conferir-catalogo.py fonte/usr.sbin/lume-configurar/loja/catalogo

      - name: Ajuda (HTML e links)
        run: |
          cd fonte/usr.sbin/lume-configurar/ajuda
          python3 - <<'PY'
          import html.parser, os, sys
          class P(html.parser.HTMLParser):
              def __init__(s): super().__init__(); s.links = []
              def handle_starttag(s, t, a):
                  for k, v in a:
                      if k in ("href", "src") and v and "://" not in v:
                          s.links.append(v.split("#")[0])
          ruins = []
          for f in sorted(os.listdir(".")):
              if f.endswith(".html"):
                  p = P(); p.feed(open(f, encoding="utf-8").read())
                  ruins += [f"{f} -> {l}" for l in p.links if l and not os.path.exists(l)]
          print("\n".join(ruins) or "links ok")
          sys.exit(bool(ruins))
          PY
